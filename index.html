    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://SEU-DOMINIO/#organizacao",
            "name": "Tarefus",
            "url": "https://SEU-DOMINIO/",
            "contactPoint": [

                "@type": "ContactPoint",
                "contactType": "customer support",
                "email": "suporte@SEU-DOMINIO",
                "availableLanguage": ["pt-BR"]
              }
            ]
          },
          {
            "@type": "SoftwareApplication",
            "name": "Tarefus",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "inLanguage": "pt-BR",
            "url": "https://SEU-DOMINIO/",
            "publisher": { "@id": "https://SEU-DOMINIO/#organizacao" },
            "description": "Gestão de tarefas para pequenas empresas: quadros por área, responsável e prazo em cada tarefa e criação de tarefas por IA com aprovação humana."
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Preciso de cartão de crédito para testar?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Não. O teste de 14 dias começa com e-mail e senha ou com a sua conta Google, sem cartão. Ao final, você decide se quer continuar."
                }
              },
              {
                "@type": "Question",
                "name": "O que acontece quando o teste de 14 dias termina?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Você escolhe um plano para continuar. Se não escolher, o seu espaço entra em modo somente leitura por 30 dias: dá para consultar e exportar tudo, mas não criar nem editar. Depois disso o acesso é bloqueado. Nada é cobrado sem a sua escolha."
                }
              },
              {
                "@type": "Question",
                "name": "Como funciona a criação de tarefas com IA?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Você descreve o que precisa ser feito, por texto ou por voz. A IA devolve um rascunho com título, descrição, responsável sugerido, prazo, etiquetas e checklist. Você revisa, edita se quiser e aprova. Nada é salvo sem a sua aprovação."
                }
              },
              {
                "@type": "Question",
                "name": "Onde ficam os dados da minha empresa?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Os dados ficam na infraestrutura de nuvem do Google (Firestore). O acesso é feito por e-mail e senha ou por conta Google, com três níveis de permissão, e as ações ficam registradas no histórico."
                }
              }
            ]
          }
        ]
      }
